name: Moo IO - LAN tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix server --no-audit --no-fund
      - run: npm install --no-audit --no-fund
      - run: node --check server/src/index.js
      - name: Verificar todos os 176 PNGs do ZIP entregue
        run: node tools/verify-bundled-art.mjs
      - run: node --test tests/*.test.mjs
  powershell-syntax:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - name: Check LAN launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in @('scripts/moo-io.ps1', 'scripts/start-server.ps1')) {
            if (-not (Test-Path $script -PathType Leaf)) { throw "Script ausente: $script" }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
          if (-not (Test-Path 'server/src/index.js')) { throw 'Servidor Node ausente' }
          if (-not (Test-Path 'MOO-IO.vbs')) { throw 'Launcher do jogo ausente' }
