name: Moo IO - Windows pronto sem downloads
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/package-windows.yml
      - windows/**
permissions:
  contents: write
jobs:
  offline-windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: windows
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar dependencias SO NA BUILD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --prefix server --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao preparar dependencias' }
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao preparar validador' }
          npm run bundle:server
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao gerar servidor local offline' }
          node tools/verify-bundled-art.mjs
          if ($LASTEXITCODE -ne 0) { throw 'PNG invalido ou ausente' }
      - name: Obter LÖVE e Node oficiais para o pacote
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $loveUrl = 'https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip'
          $loveZip = Join-Path $env:RUNNER_TEMP 'love-11.5.zip'
          Invoke-WebRequest -Uri $loveUrl -OutFile $loveZip
          $loveRoot = Join-Path $env:RUNNER_TEMP 'love-dist'
          Expand-Archive -Path $loveZip -DestinationPath $loveRoot
          $love = Get-ChildItem $loveRoot -Recurse -Filter 'love.exe' | Select-Object -First 1
          if (-not $love) { throw 'Executavel LÖVE 11.5 ausente' }
          "MOOIO_BUILD_LOVE=$($love.DirectoryName)" >> $env:GITHUB_ENV
          $nodeVersion = 'v22.16.0'
          $nodeZipName = "node-$nodeVersion-win-x64.zip"
          $nodeBase = "https://nodejs.org/dist/$nodeVersion"
          $nodeZip = Join-Path $env:RUNNER_TEMP $nodeZipName
          $sums = Join-Path $env:RUNNER_TEMP 'node-shasums.txt'
          Invoke-WebRequest -Uri "$nodeBase/$nodeZipName" -OutFile $nodeZip
          Invoke-WebRequest -Uri "$nodeBase/SHASUMS256.txt" -OutFile $sums
          $entry = Get-Content $sums | Where-Object { $_ -match ("\s" + [regex]::Escape($nodeZipName) + "$") } | Select-Object -First 1
          if (-not $entry) { throw 'SHA256 do Node nao consta na fonte oficial' }
          $expected = ($entry -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $nodeZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Node ZIP hash inconsistente com SHASUMS256 oficial' }
          $nodeRoot = Join-Path $env:RUNNER_TEMP 'node-dist'
          Expand-Archive -Path $nodeZip -DestinationPath $nodeRoot
          $nodeExe = Get-ChildItem $nodeRoot -Recurse -Filter node.exe | Select-Object -First 1
          if (-not $nodeExe) { throw 'Node x64 ausente do pacote oficial' }
          "MOOIO_BUILD_NODE=$($nodeExe.FullName)" >> $env:GITHUB_ENV
      - name: Montar distribuicao offline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/build-windows.ps1 -LoveDir $env:MOOIO_BUILD_LOVE -NodeExe $env:MOOIO_BUILD_NODE
          if ($LASTEXITCODE -ne 0) { throw 'Build interrompida' }
      - name: Testar servidor empacotado com bots SEM ACESSAR A INTERNET
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:GITHUB_WORKSPACE 'windows\dist\Moo-IO-Windows'
          $node = Join-Path $dir 'runtime\node\node.exe'
          if (-not (Test-Path (Join-Path $dir 'love.exe'))) { throw 'Faltou o LÖVE' }
          if (-not (Test-Path (Join-Path $dir 'server\node_modules\ws\package.json'))) {
            throw 'Faltaram as dependencias embarcadas'
          }
          if (Select-String -Path (Join-Path $dir 'scripts\start-server.ps1') -SimpleMatch 'npm.cmd install') {
            throw 'Download npm proibido na inicializacao'
          }
          $env:NPM_CONFIG_OFFLINE = 'true'
          $env:HOST = '127.0.0.1'
          $env:PORT = '28173'
          $env:MOO_IO_ROOM_CODE = 'offlinepack1234'
          $env:MOO_IO_BOT_COUNT = '3'
          $env:DATA_DIR = (Join-Path $env:RUNNER_TEMP 'offline-world')
          $env:PROTOCOL_BUILD_FILE = (Join-Path $env:DATA_DIR 'protocol-build.json')
          $logOut = Join-Path $env:RUNNER_TEMP 'offline-server-out.txt'
          $logErr = Join-Path $env:RUNNER_TEMP 'offline-server-err.txt'
          # Remove npm dependencies temporarily to prove the bundled offline
          # server works even when the user downloads plain GitHub source.
          $modules = Join-Path $dir 'server\node_modules'
          $hidden = Join-Path $dir 'server\node_modules.offline-test'
          Move-Item $modules $hidden
          $process = $null
          try {
            $process = Start-Process -FilePath $node -WorkingDirectory $dir -ArgumentList @('server/src/offline.mjs') -PassThru -RedirectStandardOutput $logOut -RedirectStandardError $logErr
          } catch {
            Move-Item $hidden $modules
            throw
          }
          try {
            $ready = $false
            for($i=0; $i -lt 70; $i++) {
              if($process.HasExited) { break }
              try {
                $status = Invoke-RestMethod -Uri 'http://127.0.0.1:28173/mooio/status' -TimeoutSec 2
                if($status.project -eq 'Moo-IO' -and $status.bots -eq 3) { $ready=$true; break }
              } catch {}
              Start-Sleep -Milliseconds 250
            }
            if(-not $ready) {
              Get-Content $logOut -ErrorAction SilentlyContinue | Select-Object -Last 60
              Get-Content $logErr -ErrorAction SilentlyContinue | Select-Object -Last 60
              throw 'Servidor empacotado nao iniciou corretamente com 3 bots'
            }
            Write-Host 'MOO IO OFFLINE WINDOWS PASS: Node embarcado, dependencies, 3 bots, sem npm'
          } finally {
            if($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            Move-Item $hidden $modules
          }
      - name: Testar criar sala pelo script Windows sem node_modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'windows\dist\Moo-IO-Windows'
          $modules = Join-Path $dist 'server\node_modules'
          $hidden = Join-Path $dist 'server\node_modules.test-hidden'
          if (Test-Path $hidden) { throw 'Pasta temporaria de modulos ja existe' }
          Move-Item $modules $hidden
          $env:MOO_IO_BIND_IP = '127.0.0.1'
          $env:MOO_IO_ROOM_CODE = 'roomofflinetest1234'
          $env:MOO_IO_BOT_COUNT = '2'
          $env:MOO_IO_GUI_HOST = '1'
          $env:MOO_IO_NETWORK_MODE = 'lan'
          $ps = $null
          $stdout = Join-Path $env:RUNNER_TEMP 'launcher-out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'launcher-err.log'
          try {
            $script = Join-Path $dist 'scripts\start-server.ps1'
            $ps = Start-Process -FilePath 'powershell.exe' -ArgumentList @('-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',('"' + $script + '"')) -WorkingDirectory $dist -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $ready = $false
            for($i = 0; $i -lt 100; $i++) {
              if($ps.HasExited) { break }
              try {
                $status = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/mooio/status' -TimeoutSec 2
                if($status.project -eq 'Moo-IO' -and $status.bots -eq 2) { $ready=$true; break }
              } catch {}
              Start-Sleep -Milliseconds 200
            }
            $log = Join-Path $dist 'server\data\mooio-host.log'
            if (-not (Test-Path $log)) { throw 'Script nao gravou mooio-host.log' }
            $raw = [IO.File]::ReadAllText($log, [Text.Encoding]::UTF8)
            if ($raw.IndexOf([char]0) -ge 0) { throw 'Log misturou UTF-8 e UTF-16' }
            if (-not $raw.Contains('MOOIO_PHASE_STARTING')) { throw "Startup nao chegou a fase STARTING: $raw" }
            if (-not $ready) {
              Write-Host $raw
              Get-Content (Join-Path $dist 'server\data\mooio-server-err.log') -ErrorAction SilentlyContinue | Select-Object -Last 30
              throw 'Criacao de sala pelo script falhou sem node_modules'
            }
            Write-Host 'MOO IO WINDOWS LAUNCHER PASS: sala real, offline.mjs, log UTF-8, sem node_modules'
          } finally {
            try {
              Invoke-WebRequest -Uri 'http://127.0.0.1:8081/shutdown' -Method POST -Headers @{'X-MooIO-Code'='roomofflinetest1234'} -TimeoutSec 2 -UseBasicParsing | Out-Null
            } catch {}
            if($ps -and -not $ps.HasExited) {
              if (-not $ps.WaitForExit(5000)) { Stop-Process -Id $ps.Id -Force -ErrorAction SilentlyContinue }
            }
            Move-Item $hidden $modules
            $data = Join-Path $dist 'server\data'
            if (Test-Path $data) { Remove-Item $data -Recurse -Force -ErrorAction SilentlyContinue }
            New-Item -ItemType Directory -Path $data -Force | Out-Null
          }
      - name: Publicar servidor local pronto no codigo-fonte do Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f server/src/offline.mjs
          git diff --cached --quiet
          $hasChanges = ($LASTEXITCODE -eq 1)
          if ($LASTEXITCODE -notin @(0,1)) { throw 'Falha ao comparar servidor offline' }
          if (-not $hasChanges) {
            Write-Host 'Servidor offline ja atualizado no repositorio.'
          } else {
            git commit -m 'build(windows): keep local server bundle ready in source checkout'
            if ($LASTEXITCODE -ne 0) { throw 'Nao foi possivel registrar servidor local offline' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Nao foi possivel publicar servidor offline no GitHub' }
          }
      - name: Gerar ZIP pronto
        shell: pwsh
        run: |
          Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE 'windows\dist\Moo-IO-Windows') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'windows\dist\Moo-IO-Windows-Pronto.zip') -CompressionLevel Optimal -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Moo-IO-Windows-Pronto
          path: windows/dist/Moo-IO-Windows-Pronto.zip
          if-no-files-found: error
          retention-days: 30
