name: Moo-IO private V2 - mods and customization
on:
  push:
    paths:
      - "servidor/v2/**"
      - "windows/server/src/**"
      - "windows/server/package.json"
      - "windows/shared/**"
      - ".github/workflows/private-server-v2-mods.yml"
  pull_request:
    paths:
      - "servidor/v2/**"
      - "windows/server/src/**"
      - "windows/server/package.json"
      - "windows/shared/**"
      - ".github/workflows/private-server-v2-mods.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mods:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install engine dependencies
        working-directory: windows/server
        run: npm install --no-audit --no-fund
      - name: Validate mod system and real networking
        run: node --test servidor/v2/tests/mods.test.mjs servidor/v2/tests/smoke.test.mjs servidor/v2/tests/multiroom.test.mjs servidor/v2/tests/vps.test.mjs servidor/v2/tests/auth.test.mjs servidor/v2/tests/gateway.test.mjs servidor/v2/tests/monitor.test.mjs servidor/v2/tests/control.test.mjs servidor/v2/tests/panel.test.mjs
      - name: Check Linux VPS installer syntax
        if: runner.os == 'Linux'
        run: bash -n servidor/v2/deploy/install-ubuntu.sh
      - name: Preview sample mod
        shell: bash
        run: |
          node servidor/v2/cli.mjs init --preset custom --file servidor/v2/rooms/teste.json
          node servidor/v2/cli.mjs configure --file servidor/v2/rooms/teste.json --bots 2 --capacity 35
          node servidor/v2/cli.mjs enable colheita-farta --file servidor/v2/rooms/teste.json
          node servidor/v2/cli.mjs preview --file servidor/v2/rooms/teste.json
      - name: Validate generated Caddyfile with Caddy on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq caddy
          node servidor/v2/gateway.mjs generate --domain example.com > /tmp/mooio-v2-Caddyfile
          caddy adapt --config /tmp/mooio-v2-Caddyfile --adapter caddyfile > /tmp/mooio-v2-caddy.json
