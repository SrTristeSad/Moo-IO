name: Moo IO Android autonomo - APK com servidor
on:
  push:
    branches: [feature/android-offline-host, feature/android-moba-hud, feature/android-attack-aim-joystick, fix/android-beta-install-real-hud, fix/android-server-lifecycle, feat/android-floating-controls-ui-bots, main]
    paths:
      - "android/**"
      - "windows/server/src/**"
      - ".github/workflows/android-host-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild Node server from the current authoritative gameplay sources
        run: |
          set -euo pipefail
          npm install --prefix windows --no-audit --no-fund --ignore-scripts
          npm install --prefix windows/server --no-audit --no-fund
          node windows/tools/build-offline-server.mjs
          test -s windows/server/src/offline.mjs
          # The server bundle may tree-shake human-readable packet descriptions.
          grep -q 'ranking category' windows/server/src/offline.mjs
      - name: Prepare official LÖVE Android 11.5a
        shell: bash
        run: |
          set -euo pipefail
          git clone --recurse-submodules --depth 1 --branch 11.5a https://github.com/love2d/love-android.git "$RUNNER_TEMP/love-android"
          git -C "$RUNNER_TEMP/love-android" rev-parse HEAD | grep -qi '^55feb38'
          engine="$RUNNER_TEMP/love-android"
          sed -i '/^app.name_byte_array=/d' "$engine/gradle.properties"
          sed -i 's/^#app.name=.*/app.name=Moo IO Beta/' "$engine/gradle.properties"
          sed -i 's/^app.application_id=.*/app.application_id=io.srtristesad.mooio.beta/' "$engine/gradle.properties"
          sed -i 's/^app.version_code=.*/app.version_code=3/' "$engine/gradle.properties"
          sed -i 's/^app.version_name=.*/app.version_name=0.3.0-beta/' "$engine/gradle.properties"
          sed -i 's/^app.orientation=.*/app.orientation=landscape/' "$engine/gradle.properties"
          game="$engine/app/src/embed/assets"
          mkdir -p "$game"
          cp android/main.lua android/conf.lua "$game/"
          cp -a android/src android/assets "$game/"
          sed -i 's/org.love2d.android.GameActivity/org.love2d.android.MooIOActivity/' "$engine/app/src/main/AndroidManifest.xml"
          # A foreground service isolates Node/libuv/V8 from LÖVE's SDL graphics thread.
          manifest="$engine/app/src/main/AndroidManifest.xml"
          sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a\  <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />' "$manifest"
          sed -i '/<\/application>/i\    <service android:name="org.love2d.android.MooIOServerService" android:exported="false" android:process=":mooio_node" android:foregroundServiceType="dataSync" />' "$manifest"
          grep -q 'MooIOActivity' "$manifest"
          grep -q 'MooIOServerService' "$manifest"
          grep -q 'android:usesCleartextTraffic="true"' "$engine/app/src/main/AndroidManifest.xml"
          mkdir -p "$engine/app/src/main/java/org/love2d/android" "$engine/app/src/main/cpp"
          cp android/native/*.java "$engine/app/src/main/java/org/love2d/android/"
          cp android/native/*.cpp android/native/CMakeLists.txt "$engine/app/src/main/cpp/"
      - name: Get Android-native Node.js Mobile v18.20.4
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nodejs-mobile-android.zip"
          curl -fLsS --retry 3 --max-time 240 \
            "https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip" \
            -o "$archive"
          mkdir -p "$RUNNER_TEMP/node-release"
          unzip -q "$archive" -d "$RUNNER_TEMP/node-release"
          engine="$RUNNER_TEMP/love-android"
          cmakeNode="$engine/app/src/main/cpp/node-mobile"
          mkdir -p "$cmakeNode/bin" "$cmakeNode/include/node"
          for abi in arm64-v8a x86_64; do
            lib=$(find "$RUNNER_TEMP/node-release" -type f -path "*/$abi/libnode.so" | head -1)
            if [ -z "$lib" ]; then
              echo "Node Mobile missing libnode for $abi"; exit 1
            fi
            mkdir -p "$cmakeNode/bin/$abi" "$engine/app/src/main/jniLibs/$abi"
            cp "$lib" "$cmakeNode/bin/$abi/libnode.so"
            cp "$lib" "$engine/app/src/main/jniLibs/$abi/libnode.so"
          done
          nodeHeader=$(find "$RUNNER_TEMP/node-release" -type f -name node.h | head -1)
          test -n "$nodeHeader"
          cp -a "$(dirname "$nodeHeader")/." "$cmakeNode/include/node/"
          test -f "$cmakeNode/include/node/node.h"
          cat >> "$engine/app/build.gradle" <<'GRADLE'
          android {
              defaultConfig {
                  ndk { abiFilters 'arm64-v8a', 'x86_64' }
              }
              externalNativeBuild {
                  cmake { path 'src/main/cpp/CMakeLists.txt' }
              }
          }
          GRADLE
      - name: Embed complete offline Node game server
        shell: bash
        run: |
          set -euo pipefail
          test -s windows/server/src/offline.mjs
          staging="$RUNNER_TEMP/mooio-node-assets"
          mkdir -p "$staging/server/src"
          cp windows/server/src/offline.mjs "$staging/server/src/offline.mjs"
          node android/tools/patch-node-mobile.mjs "$staging/server/src/offline.mjs"
          node --check "$staging/server/src/offline.mjs"
          cp android/native/bootstrap.mjs "$staging/server/src/bootstrap.mjs"
          (cd "$staging" && zip -q -r "$RUNNER_TEMP/mooio-server.zip" server)
          mkdir -p "$RUNNER_TEMP/love-android/app/src/main/assets"
          cp "$RUNNER_TEMP/mooio-server.zip" "$RUNNER_TEMP/love-android/app/src/main/assets/mooio-server.zip"
          unzip -tq "$RUNNER_TEMP/mooio-server.zip"
      - name: Stable beta signing when GitHub secrets are configured
        shell: bash
        env:
          MOOIO_BETA_KEYSTORE_B64: ${{ secrets.MOOIO_BETA_KEYSTORE_B64 }}
          MOOIO_BETA_STORE_PASS: ${{ secrets.MOOIO_BETA_STORE_PASS }}
          MOOIO_BETA_KEY_ALIAS: ${{ secrets.MOOIO_BETA_KEY_ALIAS }}
          MOOIO_BETA_KEY_PASS: ${{ secrets.MOOIO_BETA_KEY_PASS }}
        run: |
          set -euo pipefail
          if [ -n "${MOOIO_BETA_KEYSTORE_B64}" ]; then
            test -n "${MOOIO_BETA_STORE_PASS}"
            test -n "${MOOIO_BETA_KEY_ALIAS}"
            test -n "${MOOIO_BETA_KEY_PASS}"
            printf '%s' "${MOOIO_BETA_KEYSTORE_B64}" | base64 --decode > "$RUNNER_TEMP/mooio-beta.jks"
            chmod 600 "$RUNNER_TEMP/mooio-beta.jks"
            echo "MOOIO_BETA_KEYSTORE_PATH=$RUNNER_TEMP/mooio-beta.jks" >> "$GITHUB_ENV"
            echo "MOOIO_BETA_STORE_PASSWORD=$MOOIO_BETA_STORE_PASS" >> "$GITHUB_ENV"
            echo "MOOIO_BETA_ALIAS=$MOOIO_BETA_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "MOOIO_BETA_KEY_PASSWORD=$MOOIO_BETA_KEY_PASS" >> "$GITHUB_ENV"
            cat >> "$RUNNER_TEMP/love-android/app/build.gradle" <<'GRADLE'
          android {
              signingConfigs {
                  mooioBeta {
                      storeFile file(System.getenv('MOOIO_BETA_KEYSTORE_PATH'))
                      storePassword System.getenv('MOOIO_BETA_STORE_PASSWORD')
                      keyAlias System.getenv('MOOIO_BETA_ALIAS')
                      keyPassword System.getenv('MOOIO_BETA_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.mooioBeta }
              }
          }
          GRADLE
          else
            echo "BETA_SIGNING_EPHEMERAL: Android SDK debug cert changes per workflow."
            echo "Beta uses separate app ID so it can be installed alongside legacy APKs."
          fi
      - name: Compile standalone Android APK (ARM64 and emulator)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/love-android"
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m" assembleEmbedNoRecordDebug --stacktrace
      - name: Verify packaged game, native Node library and private server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk=$(find "$RUNNER_TEMP/love-android/app/build/outputs/apk" -name '*embed*debug*.apk' | head -1)
          test -s "$apk"
          cp "$apk" dist/Moo-IO-Android-Beta-Instalavel.apk
          unzip -l dist/Moo-IO-Android-Beta-Instalavel.apk > "$RUNNER_TEMP/apk-files.txt"
          grep -F 'assets/mooio-server.zip' "$RUNNER_TEMP/apk-files.txt"
          grep -F 'lib/arm64-v8a/libnode.so' "$RUNNER_TEMP/apk-files.txt"
          grep -F 'lib/arm64-v8a/libmooiohost.so' "$RUNNER_TEMP/apk-files.txt"
          grep -F 'assets/main.lua' "$RUNNER_TEMP/apk-files.txt"
          unzip -p dist/Moo-IO-Android-Beta-Instalavel.apk assets/src/net/mooio_host.lua | grep -F 'io.srtristesad.mooio.beta'
          sdk_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$sdk_tools/apksigner"
          test -x "$sdk_tools/aapt"
          "$sdk_tools/apksigner" verify --verbose dist/Moo-IO-Android-Beta-Instalavel.apk
          "$sdk_tools/aapt" dump badging dist/Moo-IO-Android-Beta-Instalavel.apk | grep -F "package: name='io.srtristesad.mooio.beta'"
          "$sdk_tools/aapt" dump badging dist/Moo-IO-Android-Beta-Instalavel.apk | grep -F "launchable-activity: name='org.love2d.android.MooIOActivity'"
          keytool -printcert -jarfile dist/Moo-IO-Android-Beta-Instalavel.apk | grep 'SHA256:'
      - uses: actions/upload-artifact@v4
        with:
          name: Moo-IO-Android-Beta-Instalavel
          path: dist/Moo-IO-Android-Beta-Instalavel.apk
          retention-days: 30
          if-no-files-found: error

  # Install the APK produced by this SAME commit, never a hardcoded old run.
  emulator-lifecycle:
    needs: standalone-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download current APK
        uses: actions/download-artifact@v4
        with:
          name: Moo-IO-Android-Beta-Instalavel
          path: dist
      - name: Enable Android emulator hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify zero bots, five bots, start and stop Node
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash android/tests/native_lifecycle_emulator.sh
