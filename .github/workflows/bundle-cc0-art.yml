name: Moo IO - publicar artes CC0 prontas
on:
  push:
    branches: [main]
    paths:
      - tools/build-bundled-art.mjs
      - support/reference-image-manifest.json
      - .github/workflows/bundle-cc0-art.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-art:
    if: github.repository == 'SrTristeSad/Moo-IO'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar conversor no CI
        run: npm install --no-audit --no-fund
      - name: Incluir 180 PNGs CC0 verdadeiros no repositório
        run: node tools/build-bundled-art.mjs
      - name: Conferir arquivos realmente enviados
        run: |
          node tools/verify-bundled-art.mjs
          git status --short | head -25
      - name: Commitar imagens prontas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/custom/img/
          if git diff --cached --quiet; then
            echo "Nenhuma imagem pendente."
          else
            git commit -m "assets: embed 180 ready CC0 PNG sprites"
            git push origin HEAD:main
          fi