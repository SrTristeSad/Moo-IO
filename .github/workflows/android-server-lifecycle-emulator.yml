name: Moo IO Android - iniciar e parar servidor sob demanda
on:
  push:
    branches: [fix/android-server-lifecycle]
    paths:
      - ".github/workflows/android-server-lifecycle-emulator.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android-native-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: APK integrado produzido nesta branch
        uses: actions/download-artifact@v4
        with:
          name: Moo-IO-Android-Beta-Instalavel
          repository: SrTristeSad/Moo-IO
          run-id: 39978802930
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Liberar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador - lifecycle nativo Node e notificacao
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash android/tests/native_lifecycle_emulator.sh
