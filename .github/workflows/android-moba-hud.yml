name: Moo IO - Android HUD e rankings
on:
  push:
    branches: [feature/android-moba-hud, feature/android-attack-aim-joystick, fix/android-beta-install-real-hud, feat/android-floating-controls-ui-bots, main]
    paths:
      - "android/**"
      - "windows/server/src/moomoo/mobileRankings.js"
      - "windows/server/src/network/packets.js"
      - "windows/server/src/protocol/constants.js"
      - "windows/tests/mobile-rankings.test.mjs"
      - ".github/workflows/android-moba-hud.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-ui-and-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lua and server deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          npm install --prefix windows/server --no-audit --no-fund
      - name: Lua syntax
        run: find android -name '*.lua' -print0 | xargs -0 -n1 luac -p
      - name: Functional abilities, single-row touch HUD, auto, ping and rankings
        working-directory: android
        run: |
          lua tests/touch_controls_test.lua
          lua tests/ability_actions_test.lua
          lua tests/category_rankings_test.lua
          lua tests/android_host_test.lua
          lua tests/android_home_bot_test.lua
      - name: Node authoritative categories, cross-platform packets
        working-directory: windows
        run: |
          node --test tests/mobile-rankings.test.mjs tests/crossplay-protocol.test.mjs tests/map-ping.test.mjs
