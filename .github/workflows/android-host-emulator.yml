name: Moo IO Android offline host - emulador
on:
  push:
    branches: [feature/android-offline-host]
    paths:
      - ".github/workflows/android-host-emulator.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  emulator-real-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Baixar APK com libnode integrado
        uses: actions/download-artifact@v4
        with:
          name: Moo-IO-Android-Servidor-Integrado
          repository: SrTristeSad/Moo-IO
          run-id: 39880363149
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Liberar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador - executar e testar servidor embutido REAL
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -e
            adb install -r dist/Moo-IO-Android-Servidor-Integrado.apk
            adb shell am start -n io.srtristesad.mooio/org.love2d.android.MooIOActivity
            adb forward tcp:28081 tcp:8081
            for i in $(seq 1 50); do
              if curl -fsS --max-time 2 http://127.0.0.1:28081/status | grep -q '"project":"Moo-IO"'; then
                echo "MOOIO_ANDROID_INTEGRATED_SERVER_PASS: native Node running on emulator!"
                exit 0
              fi
              sleep 2
            done
            adb logcat -d -s MooIO-Host:I MooIO-Host:E | tail -100
            echo "No integrated Node server responded on emulator loopback"
            exit 1
