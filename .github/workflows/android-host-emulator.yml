name: Moo IO Android offline host - emulador
on:
  push:
    branches: [feature/android-offline-host]
    paths:
      - ".github/workflows/android-host-emulator.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  emulator-real-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Baixar APK com libnode integrado
        uses: actions/download-artifact@v4
        with:
          name: Moo-IO-Android-Servidor-Integrado
          repository: SrTristeSad/Moo-IO
          run-id: 39884893006
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Liberar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador - executar e testar servidor embutido REAL
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -e
            adb install -r dist/Moo-IO-Android-Servidor-Integrado.apk
            adb shell am start -n io.srtristesad.mooio/org.love2d.android.MooIOActivity
            adb forward tcp:28081 tcp:8081
            bash -c 'for i in $(seq 1 14); do curl -fsS --max-time 2 http://127.0.0.1:28081/status >/tmp/mooio-status 2>/dev/null && break; sleep 2; done; exit 0'
            adb shell pidof io.srtristesad.mooio || true
            echo "---- APP BOOT LOGS ----"
            adb logcat -d -v time -s MooIO-Host:V MooIO-Node:V SDL:V SDLActivity:V love:V AndroidRuntime:E linker:E libc:F | tail -230 || true
            echo "---- NATIVE CRASHES ----"
            adb logcat -b crash -d -v brief | tail -130 || true
            echo "---- PORT 8080 / 8081 ----"
            adb shell 'cat /proc/net/tcp /proc/net/tcp6' | grep -Ei '1F90|1F91' || true
            echo "---- APP PROCESS ----"
            adb shell pidof io.srtristesad.mooio || true
            bash -c 'curl -fsS --max-time 5 http://127.0.0.1:28081/status | grep -q "\"project\":\"Moo-IO\""'
            adb shell pidof io.srtristesad.mooio
            adb shell pidof io.srtristesad.mooio:mooio_node
            echo "MOOIO_ANDROID_INTEGRATED_SERVER_PASS"
