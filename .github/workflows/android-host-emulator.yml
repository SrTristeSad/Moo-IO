name: Moo IO Android offline host - emulador
on:
  push:
    branches: [feature/android-offline-host, feature/android-moba-hud, fix/android-beta-install-real-hud, main]
    paths:
      - ".github/workflows/android-host-emulator.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  emulator-real-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Baixar APK com libnode integrado
        uses: actions/download-artifact@v4
        with:
          name: Moo-IO-Android-Servidor-Integrado
          repository: SrTristeSad/Moo-IO
          run-id: 39962893064
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/beta
      - name: Baixar APK antigo para testar instalacao lado a lado
        uses: actions/download-artifact@v4
        with:
          name: Moo-IO-Android-Servidor-Integrado
          repository: SrTristeSad/Moo-IO
          run-id: 39899840640
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/legacy
      - name: Liberar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador - executar e testar servidor embutido REAL
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -e
            echo "Instalando pacote legado e Beta lado a lado"
            adb install -r dist/legacy/Moo-IO-Android-Servidor-Integrado.apk
            adb install -r dist/beta/Moo-IO-Android-Servidor-Integrado.apk
            adb shell pm path io.srtristesad.mooio
            adb shell pm path io.srtristesad.mooio.beta
            echo "MOOIO_BETA_SIDE_BY_SIDE_INSTALL_PASS"
            echo "Iniciando jogo e servidor Node Beta"
            adb forward tcp:28081 tcp:8081
            adb shell am start -n io.srtristesad.mooio.beta/org.love2d.android.MooIOActivity
            bash -c 'for i in $(seq 1 24); do if curl -fsS --max-time 2 http://127.0.0.1:28081/status 2>/dev/null | grep -q "\"project\":\"Moo-IO\""; then echo "MOOIO_ANDROID_REAL_NODE_SERVER_PASS"; exit 0; fi; sleep 2; done; exit 1' || { adb shell run-as io.srtristesad.mooio.beta cat files/mooio-data/node-boot.log || true; adb logcat -d -v time -s MooIO-Host:V MooIO-Node:V AndroidRuntime:E libc:F | tail -120 || true; exit 1; }
            adb shell pidof io.srtristesad.mooio.beta
            adb shell pidof io.srtristesad.mooio.beta:mooio_node
            echo "MOOIO_ANDROID_BETA_INSTALL_AND_HOST_PASS"
